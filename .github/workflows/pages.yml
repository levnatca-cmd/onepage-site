name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v5
      - name: Check the production URL
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PAGES_HOST" != "levnat.ca" ] || [ -n "$PAGES_BASE_PATH" ]; then
            echo "::error::Set the GitHub Pages custom domain to levnat.ca before publishing."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages -- artifacts/build/pages
      - run: npm run build:pqc -- artifacts/build/pqc
      - run: node tooling/tests/verification/pages.mjs artifacts/build/pages artifacts/build/pqc
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/build/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
