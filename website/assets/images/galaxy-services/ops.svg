<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <radialGradient id="volume">
      <stop stop-color="#7852c9" stop-opacity=".29"/>
      <stop offset=".65" stop-color="#583d94" stop-opacity=".12"/>
      <stop offset="1" stop-color="#583d94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grid-fade">
      <stop stop-color="#fff"/>
      <stop offset=".73" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-edge">
      <ellipse cx="493" cy="274" rx="418" ry="214" fill="url(#grid-fade)"/>
    </mask>
    <pattern id="small-grid" width="23" height="23" patternUnits="userSpaceOnUse">
      <path d="M23 0H0V23" fill="none" stroke="#ba9dfa" stroke-opacity=".14"/>
      <circle r="1.4" fill="#c4b3ff" opacity=".23"/>
    </pattern>
    <linearGradient id="aperture" x2="0" y2="1">
      <stop stop-color="#a68de7" stop-opacity=".72"/>
      <stop offset=".35" stop-color="#4f437b" stop-opacity=".54"/>
      <stop offset=".62" stop-color="#272747" stop-opacity=".82"/>
      <stop offset="1" stop-color="#7165aa" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="lens">
      <stop stop-color="#f4eaff" stop-opacity=".78"/>
      <stop offset=".42" stop-color="#a98df4" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6548ab" stop-opacity=".13"/>
    </radialGradient>
    <linearGradient id="scan-cone">
      <stop stop-color="#c0a0ff" stop-opacity=".24"/>
      <stop offset=".45" stop-color="#9772ea" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8b62e3" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="front" x2=".15" y2="1">
      <stop stop-color="#b99aff" stop-opacity=".2"/>
      <stop offset=".58" stop-color="#8b6bd8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#6942a1" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="wave">
      <stop stop-color="#7a5ec0" stop-opacity=".16"/>
      <stop offset=".26" stop-color="#a98af8" stop-opacity=".7"/>
      <stop offset=".56" stop-color="#eee1ff"/>
      <stop offset=".72" stop-color="#bd9cff"/>
      <stop offset="1" stop-color="#8a68cf" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="peak-area" x2="0" y2="1">
      <stop stop-color="#a985fa" stop-opacity=".33"/>
      <stop offset="1" stop-color="#7c52c5" stop-opacity="0"/>
    </linearGradient>
    <filter id="trace-bloom" x="-.2" y="-.3" width="1.4" height="1.6">
      <feGaussianBlur stdDeviation="5.2"/>
    </filter>
    <radialGradient id="node-glow">
      <stop stop-color="#f1daff" stop-opacity=".82"/>
      <stop offset=".35" stop-color="#b48afe" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a57aff" stop-opacity="0"/>
    </radialGradient>
    <path id="primary-trace" d="M130 271h101c17 0 23-10 35-10 12 0 19 20 32 20 12 0 18-10 37-10h105
      c19 0 27-10 40-10h15l22 11 29-133 23 159 18-40 18 17h43c18 0 25 15 43 15 14 0 24-19 45-19h101"/>
  </defs>

  <ellipse cx="497" cy="265" rx="410" ry="211" fill="url(#volume)"/>
  <g mask="url(#grid-edge)">
    <path d="M80 86h825v376H80z" fill="url(#small-grid)"/>
    <g fill="none" stroke="#9f85d0" opacity=".22">
      <path d="M92 133h789m-789 69h789m-789 69h789m-789 69h789m-789 69h789"/>
      <path d="M138 86v371m92-371v371m92-371v371m92-371v371m92-371v371m92-371v371m92-371v371m92-371v371m92-371v371"/>
    </g>
    <path d="M110 238l185-126h423l134 99v144L699 433H292L110 319zM295 112v221l-3 100m426-321v222l-19 99M110 238h742M110 319h742"
      fill="none" stroke="#b69af5" stroke-opacity=".24" stroke-width="1.2"/>
  </g>

  <!-- Aperture and expansion planes echo the scanner inside the Galaxy sphere. -->
  <path d="M222 253 699 146c36 4 57 59 57 126 0 62-21 122-58 126L222 290z" fill="url(#scan-cone)"/>
  <path d="M224 253 698 146m-474 144 474 108" fill="none" stroke="#bb9bf6" stroke-width="1.35" stroke-opacity=".36"/>
  <path d="M226 261 704 193m-478 89 478 68" fill="none" stroke="#c19ffd" stroke-width="1" stroke-opacity=".26"/>
  <g stroke="#b191ef" stroke-width="1.4">
    <ellipse cx="317" cy="272" rx="25" ry="57" fill="url(#front)" stroke-opacity=".48"/>
    <ellipse cx="421" cy="272" rx="35" ry="81" fill="url(#front)" stroke-opacity=".46"/>
    <ellipse cx="548" cy="272" rx="47" ry="104" fill="url(#front)" stroke-opacity=".63"/>
    <ellipse cx="697" cy="272" rx="58" ry="128" fill="url(#front)" stroke-opacity=".58"/>
    <ellipse cx="738" cy="272" rx="54" ry="109" fill="none" stroke-opacity=".17"/>
  </g>
  <g fill="none" stroke="#d3baff" opacity=".34">
    <path d="M304 226c19-27 38 7 38 46s-19 73-38 46m103-116c27-39 49 12 49 70s-22 109-49 70m125-164c41-38 63 22 63 94s-22 132-63 94m146-212c53-41 77 29 77 118s-24 158-77 117"/>
    <path d="M291 272h52m43 0h70m45 0h94m44 0h116"/>
  </g>
  <g fill="#d8c4ff" opacity=".52">
    <circle cx="317" cy="215" r="2.3"/><circle cx="317" cy="329" r="2.3"/>
    <circle cx="421" cy="191" r="2.4"/><circle cx="421" cy="353" r="2.4"/>
    <circle cx="548" cy="168" r="2.8"/><circle cx="548" cy="376" r="2.8"/>
    <circle cx="697" cy="144" r="2.5"/><circle cx="697" cy="400" r="2.5"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M116 227c51-31 91-41 125-14 24 19 48 31 79 25 40-8 67-54 104-55 40-1 69 54 109 60 43 7 67-29 105-44 39-15 71 3 102 21 31 17 64 18 107-4"
      stroke="#b79bed" stroke-opacity=".42" stroke-width="2"/>
    <path d="M111 325c44 29 79 31 122 1 33-23 62-28 99-12 31 13 62 52 99 52 39 0 67-46 100-52 50-9 73 23 111 35 36 12 69 1 103-18 39-22 65-26 108-5"
      stroke="#8a72ce" stroke-opacity=".49" stroke-width="1.8"/>
    <path d="M122 219c63-43 98-42 136-14 50 36 75 43 121-7 38-42 80-52 124-11 45 43 75 54 126 17 51-36 95-31 134 1 27 23 53 22 91 5"
      stroke="#bb9af4" stroke-opacity=".27" stroke-width="2.2" stroke-dasharray="1 8"/>
    <path d="M126 333c70 45 109 15 145-8 44-28 72-11 108 26 45 46 88 35 123-7 33-41 68-40 112-12 54 34 97 29 141 0 33-22 61-21 93-6"
      stroke="#a088e4" stroke-opacity=".26" stroke-width="1.7" stroke-dasharray="1 7"/>
  </g>

  <path d="M162 222l43 13v73l-43 15c-23 1-38-22-38-50s15-51 38-51z"
    fill="url(#aperture)" stroke="#a386d8" stroke-opacity=".72" stroke-width="1.55"/>
  <path d="M178 231l35 10v61l-35 13c-20 0-29-20-29-42s9-42 29-42z"
    fill="#271e44" fill-opacity=".68" stroke="#a28bd5" stroke-opacity=".67" stroke-width="1.4"/>
  <path d="M132 251l31 7m-37 14 37 1m-32 19 33-6" fill="none" stroke="#c5acf3" stroke-opacity=".48" stroke-width="2"/>
  <ellipse cx="178" cy="273" rx="29" ry="42" fill="none" stroke="#b8a3e9" stroke-width="2.4" stroke-opacity=".7"/>
  <ellipse cx="202" cy="272" rx="22" ry="38" fill="#322756" fill-opacity=".84" stroke="#bda7f7" stroke-width="2.2"/>
  <ellipse cx="214" cy="272" rx="16" ry="30" fill="url(#lens)" stroke="#c8aaff" stroke-width="2"/>
  <ellipse cx="225" cy="272" rx="10" ry="20" fill="url(#lens)" stroke="#e8d6ff" stroke-width="2.8"/>
  <ellipse cx="225" cy="272" rx="28" ry="35" fill="url(#node-glow)" opacity=".7"/>
  <ellipse cx="226" cy="272" rx="4" ry="7" fill="#f3e8ff"/>

  <!-- One observed transient is the brightest point in the telemetry. -->
  <path d="M478 270l17-9 22 11 29-133 23 159 18-40 18 17 38-4v38H478z" fill="url(#peak-area)"/>
  <path d="M546 139v244" stroke="#d7b9ff" stroke-width="1.1" stroke-opacity=".41" stroke-dasharray="3 7"/>
  <circle cx="546" cy="139" r="35" fill="url(#node-glow)" opacity=".67"/>
  <circle cx="546" cy="139" r="14" fill="none" stroke="#d9baff" stroke-opacity=".55" stroke-width="1.45"/>
  <circle cx="546" cy="139" r="4.8" fill="#f6e8ff"/>
  <use href="#primary-trace" fill="none" stroke="#bd97fc" stroke-opacity=".52" stroke-width="7.8"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#trace-bloom)"/>
  <use href="#primary-trace" fill="none" stroke="url(#wave)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M239 272h589" fill="none" stroke="#bda2fa" stroke-width="1.2" stroke-opacity=".37"
    stroke-linecap="round" stroke-dasharray="1 9"/>
  <g fill="#e8d7ff">
    <circle cx="316" cy="277" r="2.6" opacity=".68"/>
    <circle cx="420" cy="271" r="3.1" opacity=".8"/>
    <circle cx="646" cy="275" r="2.8" opacity=".79"/>
    <circle cx="734" cy="271" r="2.8" opacity=".7"/>
    <circle cx="791" cy="271" r="2" opacity=".44"/>
  </g>
</svg>
