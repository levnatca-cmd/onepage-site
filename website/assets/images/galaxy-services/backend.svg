  <circle cx="185" cy="143" r="23" fill="url(#blue-halo)" opacity=".66"/>
  <circle cx="301" cy="181" r="22" fill="url(#violet-halo)" opacity=".6"/>

  <g stroke="url(#rim)" stroke-linejoin="round">
    <path d="M550 178l111 38v210l-111-39Z" fill="url(#front)" stroke-width="2.5"/>
    <path d="M661 216l114-47v211l-114 46Z" fill="url(#side)" stroke-width="2.5"/>
