    <path d="M211 153l121-49m-83 62 119-51m-84 62 121-52M228 126l117 37m-77-53 118 37" stroke="#a1b8ef" stroke-width="1" opacity=".47"/>
    <path d="M197 151v228l104 33 111-45V144M211 160v204m71-178v213m39-221v225" stroke="#8aa3d6" stroke-width="1" opacity=".32"/>
  </g>
  <path d="M206 198v151q0 17 15 22l62 20m-70-189v-19l61 19v161" stroke="#9bcbff" stroke-width="1.3" stroke-opacity=".53"/>
  <path d="M318 208l80-34v58m-80 152 80-34v-56m-67-89v180" stroke="#a6b9fa" stroke-opacity=".37" stroke-width="1.2"/>
  <g>
    <use href="#data-card" transform="translate(244 191)"/>
    <use href="#data-card" transform="translate(228 202)"/>
    <use href="#data-card" transform="translate(211 213)"/>
    <use href="#data-card" transform="translate(243 296) scale(.94 .73)"/>
    <use href="#data-card" transform="translate(228 307) scale(.94 .73)"/>
    <use href="#data-card" transform="translate(212 318) scale(.94 .73)"/>
  </g>
  <g stroke="#a7c5fc" stroke-width="1.25" opacity=".51">
    <path d="M337 218l36-14m-36 31 26-10m-25 29 30-12m-30 70 34-14m-34 32 42-18m-42 35 29-12"/>
    <circle cx="399" cy="182" r="2.6" fill="#e2e1ff"/><circle cx="399" cy="344" r="2.6" fill="#b8eaff"/>
  </g>
