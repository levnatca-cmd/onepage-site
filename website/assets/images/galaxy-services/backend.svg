    <circle cx="191" cy="320" r="2.3" opacity=".74"/><circle cx="818" cy="282" r="1.7" opacity=".7"/>
  </g>

  <g stroke="url(#rim)" stroke-linejoin="round">
    <path d="M185 143l116 38v242l-116-37Z" fill="url(#front)" stroke-width="2.5"/>
    <path d="M301 181l122-52v242l-122 52Z" fill="url(#side)" stroke-width="2.5"/>
    <path d="M185 143l121-49 117 35-122 52Z" fill="url(#roof)" stroke-width="2.5"/>
