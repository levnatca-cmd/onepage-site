<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#48649e" stop-opacity=".59"/>
      <stop offset=".4" stop-color="#182b55" stop-opacity=".74"/>
      <stop offset=".72" stop-color="#172446" stop-opacity=".81"/>
      <stop offset="1" stop-color="#354973" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5f60a0" stop-opacity=".57"/>
      <stop offset=".28" stop-color="#263b65" stop-opacity=".81"/>
      <stop offset=".73" stop-color="#162749" stop-opacity=".74"/>
      <stop offset="1" stop-color="#4a639b" stop-opacity=".53"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bddfff" stop-opacity=".67"/>
      <stop offset=".43" stop-color="#737fc8" stop-opacity=".44"/>
      <stop offset="1" stop-color="#263c6a" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d7f2ff"/>
      <stop offset=".28" stop-color="#9bc5ff"/>
      <stop offset=".65" stop-color="#556fa7"/>
      <stop offset="1" stop-color="#c7baff"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b2b4ff" stop-opacity=".56"/>
      <stop offset=".24" stop-color="#586bad" stop-opacity=".43"/>
      <stop offset=".65" stop-color="#22345f" stop-opacity=".73"/>
      <stop offset="1" stop-color="#71c6ee" stop-opacity=".57"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3e5ff"/>
      <stop offset=".2" stop-color="#a5b7ff"/>
      <stop offset=".54" stop-color="#506fa6"/>
      <stop offset=".75" stop-color="#95c7ff"/>
      <stop offset="1" stop-color="#c5adf9"/>
    </linearGradient>
    <radialGradient id="blue-halo">
      <stop stop-color="#94cfff" stop-opacity=".68"/>
      <stop offset="1" stop-color="#669cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-halo">
      <stop stop-color="#d1b4ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a277ff" stop-opacity="0"/>
    </radialGradient>
    <g id="data-card">
      <path d="M0 0l42 14v86L0 86Z" fill="url(#blade)" stroke="url(#rim)" stroke-width="1.55"/>
      <path d="M42 14l5-3v86l-5 3Z" fill="#6483b7" fill-opacity=".57" stroke="#a1c8ff" stroke-opacity=".57"/>
      <path d="M0 0l5-3 42 14-5 3Z" fill="#a7b5ef" fill-opacity=".62"/>
      <path d="M7 16l20 7m-20 1 13 4m-13 7 22 7m-22 6 16 5M7 73l27 9" stroke="#a8beec" stroke-width="1.45" stroke-linecap="round" opacity=".72"/>
      <path d="M1 86l40 13M42 15v46" stroke="#9de5ff" stroke-width="1.75" opacity=".82"/>
      <circle cx="35" cy="24" r="2.15" fill="#f4dbff"/>
    </g>
    <g id="blue-photon">
      <circle r="12" fill="url(#blue-halo)"/>
      <path d="M-8 0H7" stroke="#9adcff" stroke-opacity=".82" stroke-width="2" stroke-linecap="round"/>
      <circle r="2.5" fill="#effcff"/>
    </g>
    <g id="violet-photon">
      <circle r="12" fill="url(#violet-halo)"/>
      <path d="M-7 0H8" stroke="#d1b8ff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
      <circle r="2.5" fill="#fff0ff"/>
    </g>
    <g id="gateway">
      <ellipse cx="-6" cy="0" rx="25" ry="54" fill="#22375c" fill-opacity=".53" stroke="#87a7db" stroke-width="1.3"/>
      <ellipse rx="26" ry="55" fill="#132642" fill-opacity=".65" stroke="url(#port)" stroke-width="2.9"/>
      <ellipse cx="2" rx="21" ry="48" stroke="#93aafa" stroke-width="2.6" opacity=".54"/>
      <ellipse cx="4" rx="18" ry="43" stroke="url(#port)" stroke-width="2.1"/>
      <path d="M-14-42c8-14 19-15 26-1M-16 43c8 12 20 13 30-4" stroke="#e5e7ff" stroke-width="2.1" stroke-linecap="round"/>
    </g>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .request { animation: request-path 5.6s linear infinite; }
      .response { animation: response-path 6.3s linear infinite; }
      .request-late { animation-delay: -2.9s; }
      .response-late { animation-delay: -3.6s; }
    }
    @keyframes request-path {
      0% { transform: translate(-37px, 1px); opacity: 0; }
      14% { opacity: 1; }
      49% { transform: translate(20px, -1px); }
      86% { opacity: 1; }
      100% { transform: translate(80px, 8px); opacity: 0; }
    }
    @keyframes response-path {
      0% { transform: translate(44px, -2px); opacity: 0; }
      14% { opacity: 1; }
      50% { transform: translate(-16px, 5px); }
      86% { opacity: 1; }
      100% { transform: translate(-75px, 2px); opacity: 0; }
    }
  </style>

  <g stroke="#8ba6dc" stroke-width="1" opacity=".19">
    <path d="M75 415l467 76 314-122M138 394l471 75m-416-93 473 72m-416-92 466 70m-410-90 463 69m-409-89 457 69"/>
    <path d="M121 423l306-121m-228 134 308-120m-225 135 309-122m-223 135 310-123m-225 138 310-125"/>
  </g>
  <path d="M108 289c48-60 105-68 158-32s110 67 163 34m112-42c76-51 127-72 181-42s90 36 136-5M109 314c62 32 112 11 156-11s97-37 155-27m124 18c59 34 123 42 182 1s94-41 128-18" stroke="#9bb9fb" stroke-width="1.15" opacity=".24"/>
  <path d="M142 262c44-34 75-27 106-22m497 58c36-16 63-26 100-23" stroke="#c6a9fd" stroke-opacity=".23" stroke-dasharray="2 6"/>
