<figure id="pqc-motion-study" aria-label="Post-quantum scanner motion demonstration">
  <style>
    #pqc-motion-study {
      --pqc-bg: light-dark(#edf2f8, #040914);
      --pqc-fg: light-dark(#14253b, #eaf3ff);
      --pqc-muted: light-dark(#53647a, #95abc7);
      --pqc-blue: light-dark(#126cbb, #70c9ff);
      --pqc-gold: light-dark(#a76114, #ffc677);
      --pqc-line: light-dark(#8099b4, #38617e);
      --pqc-control: light-dark(#14253b, #eaf3ff);
      --pqc-control-fg: light-dark(#f7faff, #102238);
      margin: 0;
      color: var(--pqc-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #pqc-motion-study * { box-sizing: border-box; }
    #pqc-motion-study .pqc-stage {
      position: relative;
      height: clamp(430px, 70vw, 550px);
      overflow: hidden;
      background: var(--pqc-bg);
      isolation: isolate;
    }
    #pqc-motion-study canvas { width: 100%; height: 100%; display: block; }
    #pqc-motion-study .pqc-heading {
      position: absolute;
      left: 26px;
      top: 24px;
      pointer-events: none;
      max-width: calc(100% - 118px);
    }
    #pqc-motion-study .pqc-kicker {
      font-size: 11px;
      letter-spacing: .19em;
      color: var(--pqc-muted);
      margin-bottom: 10px;
    }
    #pqc-motion-study h2 {
      font-size: clamp(23px, 4.4vw, 35px);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: 1.07;
      margin: 0;
    }
    #pqc-motion-study .pqc-callout {
      position: absolute;
      left: 26px;
      bottom: 70px;
      font-size: 12px;
      color: var(--pqc-muted);
      pointer-events: none;
    }
    #pqc-motion-study .pqc-callout strong {
      display: block;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -.02em;
      color: var(--pqc-fg);
      margin-bottom: 5px;
    }
    #pqc-motion-study .pqc-status {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--pqc-muted);
      font-variant-numeric: tabular-nums;
    }
    #pqc-motion-study .pqc-phase { letter-spacing: .05em; }
    #pqc-motion-study .pqc-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 16px 0 10px;
    }
    #pqc-motion-study button {
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      border: 0;
      border-radius: 6px;
      background: var(--pqc-control);
      color: var(--pqc-control-fg);
      min-width: 166px;
      min-height: 44px;
      padding: 11px 20px;
    }
    #pqc-motion-study .pqc-reduced {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 44px;
      color: var(--pqc-muted);
      font-size: 12px;
    }
    #pqc-motion-study input { accent-color: var(--pqc-blue); width: 16px; height: 16px; margin: 0; }
    #pqc-motion-study .pqc-note {
      margin: 0;
      color: var(--pqc-muted);
      font-size: 11px;
      line-height: 1.5;
    }
    #pqc-motion-study .pqc-track { height: 2px; background: color-mix(in srgb, var(--pqc-fg) 10%, transparent); }
    #pqc-motion-study .pqc-track span { display: block; height: 100%; background: var(--pqc-blue); width: 0; }
    #pqc-motion-study .pqc-probe { position: absolute; visibility: hidden; }
    @media (max-width: 420px) {
      #pqc-motion-study .pqc-stage { height: 440px; }
      #pqc-motion-study .pqc-heading { left: 18px; top: 20px; }
      #pqc-motion-study .pqc-status { left: 18px; right: 18px; bottom: 20px; }
      #pqc-motion-study .pqc-callout { left: 18px; bottom: 65px; }
      #pqc-motion-study .pqc-controls { gap: 4px 14px; }
    }
  </style>
  <div class="pqc-stage">
    <canvas role="img" aria-label="Spatial cryptographic lattice: a quantum pulse, camera fly-through and transition into a diagnostic map"></canvas>
    <div class="pqc-heading">
      <div class="pqc-kicker">PQC / MOTION CONCEPT</div>
      <h2>Post-quantum<br>security</h2>
    </div>
    <div class="pqc-callout" aria-live="polite">
      <strong data-title>Inside cryptography</strong>
      <span data-detail>Spatial lattice · artistic metaphor</span>
    </div>
    <div class="pqc-status">
      <span class="pqc-phase" data-phase>READY FOR FLY-THROUGH</span>
      <span data-time>0:00 / 0:15</span>
    </div>
    <span class="pqc-probe"></span>
  </div>
  <div class="pqc-track" aria-hidden="true"><span></span></div>
  <div class="pqc-controls">
    <button type="button" class="cursor-interaction" data-play>Watch fly-through</button>
    <label class="pqc-reduced cursor-interaction"><input type="checkbox" data-reduced>Disable camera fly-through</label>
  </div>
  <figcaption class="pqc-note">Visual concept. No real security assessment is performed.</figcaption>
  <script>
    (() => {
      const root = document.getElementById('pqc-motion-study');
      const canvas = root.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const stage = root.querySelector('.pqc-stage');
      const play = root.querySelector('[data-play]');
      const reduced = root.querySelector('[data-reduced]');
      const phase = root.querySelector('[data-phase]');
      const title = root.querySelector('[data-title]');
      const detail = root.querySelector('[data-detail]');
      const timer = root.querySelector('[data-time]');
      const track = root.querySelector('.pqc-track span');
      const probe = root.querySelector('.pqc-probe');
      const duration = 15;
      const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
      let width = 736, height = 515, dpr = 1, time = 0, last = 0;
      let raf = 0, playing = false, finished = false, stageIndex = -1, labelledQuiet = null;
      let pointerX = 0, pointerY = 0;
      const palette = {};
      const nodes = [], edges = [], stars = [];
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const smooth = (a, b, v) => { const t = clamp((v-a)/(b-a)); return t*t*(3-2*t); };
      const mix = (a, b, t) => a + (b-a)*t;
      let seed = 461;
      const random = () => { seed = (seed * 16807) % 2147483647; return (seed-1)/2147483646; };
      function readPalette() {
        ['bg', 'fg', 'muted', 'blue', 'gold', 'line'].forEach(name => {
          probe.style.color = 'var(--pqc-' + name + ')';
          palette[name] = getComputedStyle(probe).color;
        });
      }
      function color(name, alpha) {
        const values = palette[name].match(/[\d.]+/g);
        return 'rgba(' + values.slice(0, 3).join(',') + ',' + clamp(alpha) + ')';
      }
      for (let z = -4; z <= 4; z++) {
        for (let y = -4; y <= 4; y++) {
          for (let x = -4; x <= 4; x++) {
            nodes.push({x, y, z, phase: random()*6.28});
          }
        }
      }
      const index = (x,y,z) => (z+4)*81+(y+4)*9+x+4;
      nodes.forEach((n,i) => {
        if (n.x<4) edges.push([i,index(n.x+1,n.y,n.z)]);
        if (n.y<4) edges.push([i,index(n.x,n.y+1,n.z)]);
        if (n.z<4) edges.push([i,index(n.x,n.y,n.z+1)]);
      });
      for (let i=0;i<100;i++) stars.push({x:random(),y:random(),r:random()*1.1+.3,a:random()*.18+.05});
      const phases = [
        ['QUANTUM THREAT','The pulse approaches','Future threat · a quantum computing metaphor'],
        ['CRYPTOGRAPHIC LATTICE','The pulse branches out','The mathematics of post-quantum cryptography'],
        ['IMMERSION','Inside cryptography','The camera moves between lattice layers'],
        ['DIAGNOSTICS','The structure becomes a report','Algorithms · certificates · migration priorities']
      ];
      function updateLabels() {
        const i = time < 2.7 ? 0 : time < 5.5 ? 1 : time < 10.7 ? 2 : 3;
        if (stageIndex !== i || labelledQuiet !== reduced.checked) {
          stageIndex = i;
          labelledQuiet = reduced.checked;
          phase.textContent = phases[i][0];
          title.textContent = i===2 && reduced.checked ? 'Mathematical structure' : phases[i][1];
          detail.textContent = i===2 && reduced.checked ? 'Reduced-motion view · stationary camera' : phases[i][2];
        }
        timer.textContent = '0:' + String(Math.floor(time)).padStart(2,'0') + ' / 0:15';
        track.style.width = (time/duration*100) + '%';
      }
      function project(p, camera) {
        const c = Math.cos(camera.yaw), s = Math.sin(camera.yaw);
        const cp = Math.cos(camera.pitch), sp = Math.sin(camera.pitch);
        const x = p.x*c + p.z*s;
        const zr = -p.x*s + p.z*c;
        const y = p.y*cp-zr*sp;
        const z = p.y*sp+zr*cp+camera.distance;
        if (z < 65) return null;
        const f = Math.min(width*1.14, 850)/z;
        return {x:width*.52+x*f, y:height*.49+y*f, f, depth:z};
      }
      function line(a,b,name,alpha,lineWidth=1) {
        if (!a || !b) return;
        if (Math.abs(a.x-b.x)>width*2 || Math.abs(a.y-b.y)>height*2) return;
        ctx.strokeStyle=color(name,alpha);
        ctx.lineWidth=lineWidth;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
      function glow(x,y,r,name,alpha) {
        if (r<.3 || x < -r || y < -r || x > width+r || y > height+r) return;
        const gradient=ctx.createRadialGradient(x,y,0,x,y,r);
        gradient.addColorStop(0,color(name,alpha));
        gradient.addColorStop(.23,color(name,alpha*.43));
        gradient.addColorStop(1,color(name,0));
        ctx.fillStyle=gradient;ctx.fillRect(x-r,y-r,r*2,r*2);
      }
      function drawCryostat(camera, opacity) {
        if(opacity<.01) return;
        for (let layer=0;layer<5;layer++) {
          const radius=48-layer*5;
          const cy=-190+layer*22;
          let previous=null;
          for (let k=0;k<=42;k++) {
            const a=k/42*Math.PI*2;
            const point=project({x:-295+Math.cos(a)*radius,y:cy,z:Math.sin(a)*radius+90},camera);
            if(previous)line(previous,point,'gold',opacity*.67,1.2);
            previous=point;
          }
          if(layer<4)for(let k=0;k<9;k++) {
            const a=k/9*Math.PI*2;
            line(project({x:-295+Math.cos(a)*radius,y:cy,z:Math.sin(a)*radius+90},camera),
              project({x:-295+Math.cos(a)*(radius-5),y:cy+22,z:Math.sin(a)*(radius-5)+90},camera), 'gold',opacity*.38);
          }
        }
      }
      function draw(t) {
        ctx.clearRect(0,0,width,height);
        ctx.fillStyle=palette.bg;ctx.fillRect(0,0,width,height);
        const quiet=reduced.checked;
        const enter=quiet?0:smooth(5.5,8.8,t);
        const exit=quiet?0:smooth(10.3,13.8,t);
        const reveal=smooth(10.7,14.8,t);
        const pulseOn=smooth(1.7,2.8,t)*(1-smooth(5.1,6.4,t));
        const camera={
          distance:mix(1000,295,enter*(1-exit)),
          yaw:mix(-.48,.025,enter)*(1-reveal)+pointerX*.045*(1-enter),
          pitch:mix(.27,.025,enter)*(1-reveal)+pointerY*.025*(1-enter)
        };
        glow(width*.56,height*.49,Math.max(width,height)*.46,'blue',.055+pulseOn*.025);
        stars.forEach(s=>{
          ctx.beginPath();ctx.arc(s.x*width,s.y*height,s.r,0,Math.PI*2);
          ctx.fillStyle=color('fg',s.a*(1-enter*.55));ctx.fill();
        });
        drawCryostat(camera,(1-enter)*(1-reveal));
        const wave=mix(-350,350,clamp((t-2)/3.6));
        const projected=nodes.map(n=>{
          const group=Math.floor((n.z+4)/3);
          const target={x:n.x*29+(group-1)*265,y:n.y*29,z:((n.z+4)%3-1)*19};
          const x=mix(n.x*57,target.x,reveal);
          const y=mix(n.y*57,target.y,reveal);
          const z=mix(n.z*57,target.z,reveal);
          const p=project({x,y,z},camera);
          const d=Math.sqrt(Math.pow(n.x*57-wave,2)+Math.pow(n.y*24,2));
          const energy=Math.exp(-d/67)*pulseOn;
          return p ? {...p,energy,group} : null;
        });
        for(let i=0;i<edges.length;i++) {
          const edge=edges[i], a=projected[edge[0]],b=projected[edge[1]];
          if(!a||!b)continue;
          const separate=projected[edge[0]].group!==projected[edge[1]].group;
          const alpha=clamp(530/((a.depth+b.depth)/2),.13,.64)*(1-reveal*(separate?.92:.22));
          const energy=(a.energy+b.energy)/2;
          line(a,b,energy>.3?'gold':'line',alpha*(.49+energy*.5),energy>.3?1.25:.7);
          if(energy>.25)line(a,b,'blue',energy*.53,1.2);
        }
        const ordered=projected.filter(Boolean).sort((a,b)=>b.depth-a.depth);
        for (let i=0;i<ordered.length;i++) {
          const p=ordered[i];
          if(p.x < -20||p.x>width+20||p.y < -20||p.y>height+20)continue;
          const r=clamp(p.f*2.2,.5,7);
          if(p.energy>.22)glow(p.x,p.y,r*6,'blue',p.energy*.31);
          if(p.energy>.64)glow(p.x,p.y,r*3,'gold',p.energy*.49);
          const sphere=ctx.createRadialGradient(p.x-r*.33,p.y-r*.4,.1,p.x,p.y,r);
          sphere.addColorStop(0,color('fg',.83));
          sphere.addColorStop(.3,color(p.energy>.44?'gold':'blue',.65));
          sphere.addColorStop(1,color('line',.3));
          ctx.fillStyle=sphere;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
        }
        // An approaching impulse becomes branching paths, never an explosion or flash.
        if(t>0&&t<6.5) {
          const head=mix(-420,240,clamp((t-.3)/4.9));
          const opacity=(1-smooth(5.3,6.5,t));
          for(let branch=0;branch<19;branch++) {
            const spread=smooth(2.4,4.3,t);
            let prev=null;
            for(let k=0;k<28;k++) {
              const f=k/27;
              const x=head-170+f*170;
              const y=-70+(branch-9)*8*spread+Math.sin(f*2.8+branch*.24)*11*spread;
              const z=(branch-9)*9*spread;
              const p=project({x,y,z},camera);
              if(prev)line(prev,p,spread>.65?'blue':'gold',opacity*f*.5,.8);
              prev=p;
            }
            const p=project({x:head,y:-70+(branch-9)*8*spread,z:(branch-9)*9*spread},camera);
            if(p)glow(p.x,p.y,7,'gold',opacity*.5);
          }
        }
        // Depth cues stream past the viewer during the controlled camera pass.
        if(enter>.05&&exit<.94&&!quiet) {
          const pass=enter*(1-exit);
          for(let i=0;i<40;i++) {
            const angle=i*2.39996;
            const radius=95+(i%7)*31;
            const z=((i*51+t*126)%690)-260;
            const a=project({x:Math.cos(angle)*radius,y:Math.sin(angle)*radius,z},camera);
            const b=project({x:Math.cos(angle)*radius,y:Math.sin(angle)*radius,z:z-22},camera);
            line(a,b,'blue',pass*.27,1.1);
          }
        }
        const core=project({x:0,y:0,z:0},camera);
        if(core&&reveal<.5) {
          glow(core.x,core.y,Math.min(45,19*core.f),'blue',.26);
          for(let i=0;i<3;i++) {
            const r=17+i*7;
            const verts=[];
            for(let z=-1;z<=1;z+=2)for(let y=-1;y<=1;y+=2)for(let x=-1;x<=1;x+=2)verts.push(project({x:x*r,y:y*r,z:z*r},camera));
            [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]].forEach(e=>line(verts[e[0]],verts[e[1]],'blue',.6,1.2));
          }
        }
        if(reveal>.65) {
          const labels=['Algorithms','Certificates','PQC migration'];
          const labelSize=width<420?11:12;
          ctx.font='400 '+labelSize+'px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign='center';ctx.fillStyle=color('fg',smooth(.65,1,reveal));
          for(let i=0;i<3;i++) {
            const p=project({x:(i-1)*265,y:146,z:0},camera);
            if(p)ctx.fillText(labels[i],p.x,p.y);
          }
        }
        // Keep text readable while the moving geometry fills the entire frame.
        const top=ctx.createLinearGradient(0,0,0,160);
        top.addColorStop(0,color('bg',.97));top.addColorStop(.6,color('bg',.74));top.addColorStop(1,color('bg',0));
        ctx.fillStyle=top;ctx.fillRect(0,0,width,160);
        const bottom=ctx.createLinearGradient(0,height-140,0,height);
        bottom.addColorStop(0,color('bg',0));bottom.addColorStop(.6,color('bg',.88));bottom.addColorStop(1,color('bg',.98));
        ctx.fillStyle=bottom;ctx.fillRect(0,height-140,width,140);
      }
      function render() { draw(time); updateLabels(); }
      function frame(now) {
        if(!playing){raf=0;return;}
        if(last)time=Math.min(duration,time+Math.min((now-last)/1000,.06));
        last=now;render();
        if(time>=duration){playing=false;finished=true;play.textContent='Replay';raf=0;return;}
        raf=requestAnimationFrame(frame);
      }
      function save() {
        if(window.openai?.setWidgetState) window.openai.setWidgetState({
          modelContent:{concept:'PQC lattice fly-through',cameraFlight:!reduced.checked},
          privateContent:{reduced:reduced.checked}
        }).catch(()=>{});
      }
      function applyState(saved) {
        if(typeof saved?.privateContent?.reduced==='boolean')reduced.checked=saved.privateContent.reduced;
        render();
      }
      reduced.checked=motionQuery.matches;
      const initialState=window.openai?.widgetState;
      if(typeof initialState?.privateContent?.reduced==='boolean')reduced.checked=initialState.privateContent.reduced || motionQuery.matches;
      play.addEventListener('click',()=>{
        if(playing){playing=false;cancelAnimationFrame(raf);raf=0;last=0;play.textContent='Resume';}
        else {
          if(finished){time=0;stageIndex=-1;finished=false;}
          playing=true;last=0;play.textContent='Pause';
          if(!raf)raf=requestAnimationFrame(frame);
        }
      });
      reduced.addEventListener('change',()=>{save();render();});
      motionQuery.addEventListener('change',event=>{reduced.checked=event.matches;render();});
      window.addEventListener('openai:set_globals',event=>{
        if(event.detail?.globals?.widgetState)applyState(event.detail.globals.widgetState);
      });
      stage.addEventListener('pointermove',event=>{
        if(playing||reduced.checked)return;
        const rect=stage.getBoundingClientRect();
        pointerX=(event.clientX-rect.left)/rect.width-.5;
        pointerY=(event.clientY-rect.top)/rect.height-.5;
        draw(time);
      });
      stage.addEventListener('pointerleave',()=>{pointerX=0;pointerY=0;if(!playing)draw(time);});
      document.addEventListener('visibilitychange',()=>{
        if(document.hidden&&playing){playing=false;cancelAnimationFrame(raf);raf=0;last=0;play.textContent='Resume';}
      });
      function resize() {
        const bounds=stage.getBoundingClientRect();
        width=Math.max(1,bounds.width);height=Math.max(1,bounds.height);
        dpr=Math.min(devicePixelRatio||1,1.65);
        canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        readPalette();render();
      }
      new ResizeObserver(resize).observe(stage);
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readPalette();render();});
      readPalette();resize();
    })();
  </script>
</figure>
